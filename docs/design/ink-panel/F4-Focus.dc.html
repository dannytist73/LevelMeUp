<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trial of Stillness focus session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Gothic+A1:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#F1ECE1}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 26px 20px 24px; background-color: #0E0E10; background-image: radial-gradient(rgba(241,236,225,0.06) 1.1px, transparent 1.6px); background-size: 7px 7px; color: #F1ECE1; font-family: 'Gothic A1', system-ui, sans-serif">

  <span style="font-family: 'Black Han Sans', sans-serif; font-size: 15px; letter-spacing: 0.18em; color: #F0765E">TRIAL OF STILLNESS</span>
  <h1 style="margin: 6px 0 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.04em">FOCUS SESSION</h1>

  <div role="timer" aria-label="6 minutes 42 seconds left of 10 minutes" style="position: relative; width: 280px; height: 280px; margin-top: 30px">
    <svg aria-hidden="true" width="280" height="280" viewBox="0 0 280 280">
      <circle cx="140" cy="140" r="120" fill="none" stroke="#2A2A2F" stroke-width="16"></circle>
      <circle cx="140" cy="140" r="120" fill="none" stroke="#E0452B" stroke-width="16" stroke-dasharray="753.98" stroke-dashoffset="505.2" transform="rotate(-90 140 140)"></circle>
      <circle cx="140" cy="140" r="98" fill="none" stroke="#F1ECE1" stroke-width="2"></circle>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 66px; line-height: 1">06:42</span>
      <span style="font-size: 14px; font-weight: 500; color: #A8A196">left of 10:00</span>
    </div>
  </div>

  <div style="position: relative; align-self: stretch; margin-top: 34px; padding: 20px 16px 14px; border: 2px solid #151515; box-shadow: 0 0 0 2px #E8E1D3; background: #E8E1D3; color: #151515">
    <span style="position: absolute; top: -14px; left: 12px; padding: 3px 10px; border: 2px solid #E8E1D3; background: #151515; color: #F1ECE1; font-family: 'Black Han Sans', sans-serif; font-size: 13px; letter-spacing: 0.14em">SYSTEM</span>
    <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.5">Stay with it. If you leave the app, the timer pauses and waits for you.</p>
  </div>

  <p style="display: flex; gap: 10px; align-items: flex-start; align-self: stretch; margin: 16px 0 0; padding: 12px 14px; border: 2px solid #4A4A50; font-size: 13px; line-height: 1.5; color: #C9C2B6">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1ECE1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><rect x="5" y="2" width="14" height="20" rx="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
    <span>Calls, messages and every other app still work. Leaving only pauses this timer.</span>
  </p>

  <div style="display: flex; flex-direction: column; align-items: stretch; gap: 6px; align-self: stretch; margin-top: auto">
    <button style="height: 50px; border: 2px solid #4A4A50; background: transparent; color: #F1ECE1; font-size: 15px; font-weight: 700">End session</button>
    <span style="text-align: center; font-size: 12px; line-height: 1.45; color: #A8A196">Ending keeps the side quests sealed. Start again any time today.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
