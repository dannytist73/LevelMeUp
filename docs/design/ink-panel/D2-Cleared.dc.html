<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest cleared</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Gothic+A1:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#F1ECE1}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 24px 20px 24px; background-color: #121215; background-image: repeating-conic-gradient(from 0deg at 50% 18%, rgba(241,236,225,0.07) 0deg 1.4deg, transparent 1.4deg 7deg); color: #F1ECE1; font-family: 'Gothic A1', system-ui, sans-serif">

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 18px">
    <span style="font-family: 'Black Han Sans', sans-serif; font-size: 14px; letter-spacing: 0.2em; color: #A8A196">CORE QUEST · KNEE PUSH-UPS</span>
    <h1 style="margin: 10px 0 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 82px; line-height: 1; color: #F1ECE1; transform: rotate(-4deg); text-shadow: -3px -3px 0 #151515, 3px -3px 0 #151515, -3px 3px 0 #151515, 3px 3px 0 #151515, 0 3px 0 #151515, 0 -3px 0 #151515, 7px 7px 0 #E0452B">CLEARED</h1>
    <span style="margin-top: 14px; font-size: 14px; color: #C9C2B6">3 sets of 8 logged</span>
    <div style="position: absolute; top: -6px; right: -4px; width: 86px; height: 86px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #E8E1D3; border-radius: 50%; background: #C2321C; color: #FFFFFF; transform: rotate(12deg)">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 30px; line-height: 1">+20</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.2em">XP</span>
    </div>
  </div>

  <section aria-label="Rewards" style="display: flex; flex-direction: column; gap: 12px; margin-top: 26px; padding: 26px 16px 16px; background: #E8E1D3; color: #151515; clip-path: polygon(0 14px, 100% 0, 100% 100%, 0 100%)">
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid #151515">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Black Han Sans', sans-serif; font-size: 13px; letter-spacing: 0.14em; color: #B02E1A">STAT UP</span>
        <span style="font-family: 'Black Han Sans', sans-serif; font-size: 26px; line-height: 1.1">STRENGTH 11 → 12</span>
      </div>
      <span style="width: 40px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 3px solid #B02E1A; border-radius: 50%; color: #B02E1A; font-family: 'Black Han Sans', sans-serif; font-size: 21px; transform: rotate(-8deg)">D</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 500">
      <span>Discipline · today counts</span>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 17px">+5</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 500">
      <span>Streak</span>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 17px">9 → 10 DAYS</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 2px">
      <div style="position: relative; height: 14px; box-sizing: border-box; border: 2px solid #151515">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 67%; background: #E0452B"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #4F493F">
        <span>LV 6 · 87 / 130 XP</span>
        <span>43 to Lv 7</span>
      </div>
    </div>
  </section>

  <div role="group" aria-labelledby="rate-label" style="display: flex; flex-direction: column; gap: 8px; margin-top: 22px">
    <span id="rate-label" style="font-size: 13px; font-weight: 500; color: #C9C2B6">How did it feel? Optional, it tunes your next step.</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button aria-pressed="false" style="height: 46px; border: 2px solid #4A4A50; background: transparent; color: #F1ECE1; font-size: 14px; font-weight: 700">Easy</button>
      <button aria-pressed="true" style="height: 46px; border: 2px solid #E8E1D3; background: #E8E1D3; color: #151515; font-size: 14px; font-weight: 700">Right</button>
      <button aria-pressed="false" style="height: 46px; border: 2px solid #4A4A50; background: transparent; color: #F1ECE1; font-size: 14px; font-weight: 700">Too hard</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto">
    <button style="height: 56px; border: 0; background: #E8E1D3; color: #151515; font-family: 'Black Han Sans', sans-serif; font-size: 19px; letter-spacing: 0.16em">CONTINUE</button>
    <button style="height: 44px; border: 0; background: transparent; color: #C9C2B6; font-size: 14px; font-weight: 700; text-decoration: underline">Logged by mistake? Undo</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
