<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Gothic+A1:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
a{color:#F0765E}a:hover{color:#F59A86}
button,textarea{font:inherit}
button{cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 22px 20px 20px; background-color: #050506; background-image: repeating-conic-gradient(from 0deg at 50% 22%, rgba(240,118,94,0.06) 0deg 1deg, transparent 1deg 9deg); color: #F1ECE1; font-family: 'Gothic A1', system-ui, sans-serif">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Black Han Sans', sans-serif; font-size: 13px; letter-spacing: 0.14em; color: #A8A196">DAY 13 · SUN 11 OCT</span>
    <span style="font-family: 'Black Han Sans', sans-serif; font-size: 13px; letter-spacing: 0.14em; color: #F0765E">PACT · LEVEL 1</span>
  </div>

  <div style="position: relative; margin-top: 18px">
    <div style="height: 210px; display: flex; align-items: center; justify-content: center; background-color: #111113; background-image: radial-gradient(rgba(240,118,94,0.22) 1.1px, transparent 1.6px); background-size: 6px 6px; clip-path: polygon(0 7%, 9% 0, 21% 6%, 34% 0, 47% 7%, 60% 0, 73% 6%, 87% 0, 100% 7%, 100% 93%, 90% 100%, 76% 94%, 62% 100%, 48% 93%, 34% 100%, 20% 94%, 8% 100%, 0 93%)">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
        <div aria-hidden="true" style="display: flex; gap: 34px">
          <span style="width: 34px; height: 7px; background: #E0452B; transform: rotate(10deg); box-shadow: 0 0 14px #E0452B"></span>
          <span style="width: 34px; height: 7px; background: #E0452B; transform: rotate(-10deg); box-shadow: 0 0 14px #E0452B"></span>
        </div>
        <span style="padding: 5px 10px; border: 1.5px dashed #A8A196; color: #C9C2B6; font-size: 12px; font-weight: 700">Shadow art (to be painted)</span>
      </div>
    </div>
    <span style="position: absolute; bottom: -14px; right: 6px; padding: 5px 12px; border: 3px solid #F0765E; background: #050506; color: #F0765E; font-family: 'Black Han Sans', sans-serif; font-size: 16px; letter-spacing: 0.1em; transform: rotate(-6deg)">CLAIMED · SAT 10 OCT</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; margin-top: 34px">
    <div style="position: relative; padding: 20px 14px 12px; border: 2px solid #F0765E; background: #050506">
      <span style="position: absolute; top: -13px; left: 10px; padding: 2px 9px; background: #F0765E; color: #151515; font-family: 'Black Han Sans', sans-serif; font-size: 12px; letter-spacing: 0.14em">THE SHADOW</span>
      <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.45">The day closed in silence, so I took it.</p>
    </div>
    <div style="position: relative; margin-left: 28px; padding: 14px 14px 12px; border: 2px solid #F0765E; background: #050506">
      <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.45">It stays mine until you clear the recovery quest. Come and take it back.</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 20px">
    <label for="note" style="font-size: 13px; color: #C9C2B6">What got in the way? Optional, and only you can see it.</label>
    <textarea id="note" rows="2" style="box-sizing: border-box; padding: 10px 12px; border: 2px solid #4A4A50; border-radius: 0; background: #111113; color: #F1ECE1; font-size: 15px; line-height: 1.45; resize: none"></textarea>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; margin-top: auto">
    <button style="height: 56px; border: 0; background: #E8E1D3; color: #151515; font-family: 'Black Han Sans', sans-serif; font-size: 18px; letter-spacing: 0.1em">TAKE BACK THE DAY · 5 MIN</button>
    <a href="#settings" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">Change or turn off the Pact in Settings</a>
  </div>
</div>
