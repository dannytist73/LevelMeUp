<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding 9: The vow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Gothic+A1:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
a{color:#F1ECE1}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 28px 20px 28px; background-color: #121215; background-image: radial-gradient(rgba(241,236,225,0.10) 1.1px, transparent 1.6px); background-size: 7px 7px; color: #F1ECE1; font-family: 'Gothic A1', system-ui, sans-serif">

  <div style="position: relative; margin-top: 24px; padding: 22px 16px 14px; border: 2px solid #151515; box-shadow: 0 0 0 2px #E8E1D3; background: #E8E1D3; color: #151515">
    <span style="position: absolute; top: -14px; left: 12px; padding: 3px 10px; border: 2px solid #E8E1D3; background: #151515; color: #F1ECE1; font-family: 'Black Han Sans', sans-serif; font-size: 13px; letter-spacing: 0.14em">SYSTEM</span>
    <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.5">One last thing. A vow is a promise to yourself. It's optional, and nothing happens if you skip it.</p>
  </div>

  <div style="position: relative; margin: 46px 6px 0 0">
    <div aria-hidden="true" style="position: absolute; inset: 0; transform: translate(6px, 6px); background: #E0452B; clip-path: polygon(0 18px, 100% 0, 100% 100%, 0 100%)"></div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 34px 18px 16px; background: #E8E1D3; color: #151515; clip-path: polygon(0 18px, 100% 0, 100% 100%, 0 100%)">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 14px; letter-spacing: 0.16em; color: #B02E1A">YOUR VOW</span>
      <p style="margin: 0; font-family: 'Black Han Sans', sans-serif; font-size: 31px; line-height: 1.15">I will clear one quest a day, even a small one.</p>
      <button style="align-self: flex-start; height: 44px; padding: 0 14px; border: 2px solid #151515; background: transparent; color: #151515; font-size: 14px; font-weight: 700">Change the words</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
    <button aria-describedby="hold-hint" style="position: relative; height: 66px; overflow: hidden; border: 2px solid #E8E1D3; background: #C2321C; color: #FFFFFF; font-family: 'Black Han Sans', sans-serif; font-size: 21px; letter-spacing: 0.18em">
      <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 60%; background: #8E2414"></span>
      <span style="position: relative">HOLD TO SWEAR</span>
    </button>
    <p id="hold-hint" style="margin: 0; text-align: center; font-size: 13px; color: #A8A196">Hold for 2 seconds.</p>
    <button style="height: 50px; border: 2px solid #4A4A50; background: transparent; color: #F1ECE1; font-size: 15px; font-weight: 700">Skip the vow</button>
  </div>
</div>
</x-dc>

</html>
